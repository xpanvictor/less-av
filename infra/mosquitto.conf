# LESS broker config — Mosquitto backbone for all five nodes.
#
# Closed demo LAN: authentication is deliberately deferred. See the "Known
# limitations" section of docs/ARCHITECTURE.md.

# Plain MQTT for the ESP32 nodes (VCU, joystick, camera) and the autonomy node.
listener 1883 0.0.0.0

# MQTT-over-WebSocket for the iPad dashboard.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence false
persistence_location infra/data/

log_dest stdout
